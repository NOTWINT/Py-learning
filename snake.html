<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake – Responsive</title>
<style>
    body { 
        margin: 0; 
        overflow: hidden; 
        font-family: Arial, sans-serif; 
        background: #111; 
        color: #eee; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
    }
    canvas { 
        display: block; 
        max-width: 96%; 
        max-height: 96%; 
        background: #222; 
        border-radius: 4px; 
        box-shadow: 0 0 15px rgba(0,0,0,0.8); 
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

/* -------------------  CONFIGURATION  ------------------------------------ */
const gridSize = 20; 
let fps = 10; // Frames per second (controls snake speed)
let now, delta;
let then = Date.now();
let interval = 1000 / fps;

/* -------------------  GAME STATE  ------------------------------------- */
let snake = [];
let food = { x: 0, y: 0 };
let dx = gridSize; 
let dy = 0;
let score = 0;
let gameRunning = false;
let changingDirection = false;

// Initializes or resets the game variables
function init() {
    snake = [
        { x: 160, y: 160 },
        { x: 140, y: 160 },
        { x: 120, y: 160 }
    ];
    dx = gridSize;
    dy = 0;
    score = 0;
    gameRunning = true;
    generateFood();
}

/* -------------------  HELPERS  ---------------------------------------- */
// Generates a random coordinate aligned to our 20px grid
function randomGridPosition(min, max) {
    return Math.floor((Math.random() * (max - min + 1) + min) / gridSize) * gridSize;
}

function generateFood() {
    food.x = randomGridPosition(0, canvas.width - gridSize);
    food.y = randomGridPosition(0, canvas.height - gridSize);
    
    // Ensure food doesn't spawn exactly where the snake's body currently is
    snake.forEach(function has_snake_eaten_food(part) {
        if (part.x === food.x && part.y === food.y) {
            generateFood();
        }
    });
}

/* -------------------  INPUT HANDLING  --------------------------------- */
document.addEventListener('keydown', (e) => {
    // Prevent the window from scrolling when pressing arrow keys
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.key) > -1) {
        e.preventDefault();
    }

    // Restart game on any key press if game is over
    if (!gameRunning) {
        init();
        return;
    }

    // Prevent rapidly reversing direction in a single frame
    if (changingDirection) return;
    changingDirection = true;

    const goingUp = dy === -gridSize;
    const goingDown = dy === gridSize;
    const goingRight = dx === gridSize;
    const goingLeft = dx === -gridSize;

    if (e.key === 'ArrowLeft' && !goingRight) {
        dx = -gridSize;
        dy = 0;
    } else if (e.key === 'ArrowUp' && !goingDown) {
        dx = 0;
        dy = -gridSize;
    } else if (e.key === 'ArrowRight' && !goingLeft) {
        dx = gridSize;
        dy = 0;
    } else if (e.key === 'ArrowDown' && !goingUp) {
        dx = 0;
        dy = gridSize;
    } else {
        changingDirection = false;
    }
});

/* -------------------  MAIN LOOP  -------------------------------------- */
function update() {
    if (!gameRunning) return;

    // Calculate new head position
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // 1. Check Wall Collision
    if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameRunning = false;
        return;
    }

    // 2. Check Self Collision
    for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            gameRunning = false;
            return;
        }
    }

    // 3. Move Snake
    snake.unshift(head); // Add new head

    // 4. Check Food Collision
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        generateFood();
    } else {
        snake.pop(); // Remove tail if no food eaten
    }
}

/* -------------------  RENDERING  ------------------------------------- */
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw food
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(food.x, food.y, gridSize, gridSize);

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? '#00FF7F' : '#00CC66'; // Highlight head
        ctx.fillRect(part.x, part.y, gridSize - 1, gridSize - 1); // 1px gap for blocky effect
    });

    // Score overlay
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 10, 30);

    // Game over screen
    if (!gameRunning && score > 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 30px Arial';
        ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 10);
        
        ctx.font = '16px Arial';
        ctx.fillText('Press any key to restart', canvas.width / 2, canvas.height / 2 + 25);
    }
}

/* -------------------  GAME LOOP  -------------------------------------- */
function gameLoop() {
    // This tells the browser to keep calling gameLoop continually
    window.requestAnimationFrame(gameLoop);

    // Throttle frame rate based on FPS interval
    now = Date.now();
    delta = now - then;

    if (delta > interval) {
        then = now - (delta % interval);
        changingDirection = false; // Reset direction lock for the next frame
        update();
        render();
    }
}

// Start Game Engine
init();
window.requestAnimationFrame(gameLoop);

</script>
</body>
</html>
